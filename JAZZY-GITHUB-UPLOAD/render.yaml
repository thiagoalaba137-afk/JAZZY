# Render Blueprint: TESTING ONLY. Free instances have ephemeral filesystems.
# Account changes, pairings, and encrypted events can disappear after restarts.
services:
  - type: web
    name: jazzy-relay
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: JAZZY_SETUP_TOKEN
        generateValue: true
      - key: JAZZY_MAX_ROOM_MB
        value: '100'
